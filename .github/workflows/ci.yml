name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A failing job blocks deployment when this workflow is set as a
# required status check in the repository's branch protection rules.
jobs:
  verify:
    name: Lint, schema, test & build
    runs-on: ubuntu-latest
    env:
      # Placeholder values — CI never connects to a real database.
      # The build and tests run fully offline with mocked data.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      AUTH_SECRET: ci-placeholder-secret-not-used-for-real-auth
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Prisma format check
        run: npx prisma format --check

      - name: Prisma validate
        run: npx prisma validate

      - name: Unit & integration tests
        run: npm test

      - name: Production build
        run: npm run build

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: verify
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pettrack
          POSTGRES_PASSWORD: pettrack
          POSTGRES_DB: pettrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pettrack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://pettrack:pettrack@localhost:5432/pettrack
      DIRECT_URL: postgresql://pettrack:pettrack@localhost:5432/pettrack
      AUTH_SECRET: e2e-placeholder-secret-must-be-at-least-32-chars
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # This job sets NODE_ENV=production (the app runs in prod mode for the
      # e2e pass), which makes `npm ci` omit devDependencies. The production
      # build still needs them (e.g. @tailwindcss/postcss, typescript), so
      # force their installation here.
      - run: npm ci --include=dev

      - name: Apply migrations
        run: npm run db:migrate:deploy

      # NOTE: there is intentionally no `prisma migrate diff` drift check here.
      # The pg_trgm migration creates GIN trigram indexes via raw SQL
      # (`USING GIN (... gin_trgm_ops)`), which cannot be represented in the
      # Prisma datamodel. Any datamodel-vs-database diff therefore always
      # reports those indexes as drift and can never pass. The `Apply
      # migrations` step above (real Postgres) plus `prisma validate` /
      # `prisma format --check` in the verify job are the migration safety net.

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run e2e
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
